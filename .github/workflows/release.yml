name: Release

# Crea l'installer Windows e lo pubblica nelle Releases quando si fa il push di un tag v* (es. v0.2.1).
# L'app installata scarica da qui gli aggiornamenti (latest.yml + installer + blockmap).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Dipendenze
        run: npm ci
      - name: Interfaccia (Angular)
        run: npm run build:ui
      - name: Installer
        run: npx electron-builder --win --publish never
      - name: Pubblicazione (una sola Release per tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --title "Studio Agent ${GITHUB_REF_NAME#v}" \
            --notes "Novità: vedi CHANGELOG.md. Installa Studio-Agent-Setup-${GITHUB_REF_NAME#v}.exe; le versioni già installate si aggiornano da sole."
